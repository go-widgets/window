name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Track the latest stable Go (org convention). go.mod floor is 1.26.4.
jobs:
  # Build + vet the whole module CGO-free on Linux and macOS, then enforce a
  # 100% statement-coverage gate on the sovereign X11 protocol layer
  # (internal/x11: wire codec, setup, Xauthority, keysym mapping,
  # request/reply/event demux, PutImage). The live-window layer is proven by
  # the Xvfb integration test (gated behind WINDOW_X11_INTEGRATION); its
  # transport-agnostic logic is additionally exercised in-process here.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go version
      - run: CGO_ENABLED=0 go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - name: Test (whole module)
        run: CGO_ENABLED=0 go test ./...
      - name: 100% coverage gate (internal/x11)
        shell: bash
        # -race needs cgo, so this step (and only this step) enables it. The
        # library stays CGO-free, proven by the CGO=0 arch matrix below.
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race -timeout 300s -coverprofile=cover.out ./internal/x11/
          go tool cover -func=cover.out | tail -n 40
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "internal/x11 coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::internal/x11 coverage ${cov}% < 100%"; exit 1; }

  # The macOS lane above also proves the non-Linux stub (Open -> ErrUnsupported)
  # builds and passes. Named here for clarity of intent.
  darwin-stub:
    name: darwin stub build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: CGO_ENABLED=0 go build ./... && CGO_ENABLED=0 go test ./...

  # Validate the module on the six supported 64-bit targets, strictly CGO=0.
  # amd64/arm64 run natively; the rest run under qemu-user. This is where the
  # wire codec's big-endian path is exercised on real big-endian (s390x) and
  # little-endian (ppc64le/riscv64/loong64) models.
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go env GOARCH && CGO_ENABLED=0 go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Test under qemu (${{ matrix.goarch }})
        run: CGO_ENABLED=0 GOARCH=${{ matrix.goarch }} go test -exec=${{ matrix.qemu }} ./...

  # Live X11 proof: open a real window under Xvfb, present a known test
  # pattern, capture it and assert sampled pixels; synthesise a key + click
  # via xdotool and assert the dispatched toolkit.Event. Gated on Linux.
  live-xvfb:
    name: live X11 (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install X utilities
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-apps xdotool imagemagick
      - name: Run live integration test under Xvfb
        env:
          WINDOW_X11_INTEGRATION: "1"
        run: xvfb-run -s "-screen 0 1024x768x24" go test -tags=integration -run TestLive -v ./...
