name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Track the latest stable Go (org convention). go.mod floor is 1.26.4.
jobs:
  # Build + vet + test the whole module CGO-free on Linux, then enforce a
  # 100% statement-coverage gate on the sovereign X11 and Wayland protocol
  # layers (wire codec, setup, Xauthority, keysym/xkb mapping,
  # request/reply/event demux, PutImage, wl_shm/xdg-shell). The backends'
  # OS-specific syscalls (SCM_RIGHTS transport, mmap-backed shm) are Linux-only
  # by build tag, so the coverage gate runs on Linux only; the macOS lane
  # (darwin-stub) proves the transport-agnostic codec and the ErrUnsupported
  # stub still build and pass off Linux, and the cross-build lane proves the
  # module compiles for windows/amd64, darwin and every supported arch. The
  # live-window layer is proven by the Xvfb/sway integration lanes below.
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go version
      - run: CGO_ENABLED=0 go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - name: Gofmt
        # go vet does NOT check formatting, so drift accumulates silently: ten
        # files had gone out of gofmt on main before this step existed. Printing
        # the diff makes a failure actionable rather than just a list of names.
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then
            echo "::error::not gofmt-clean:"; echo "$drift"
            gofmt -d .
            exit 1
          fi
      - name: Test (whole module)
        run: CGO_ENABLED=0 go test ./...
      - name: Race (the window package itself)
        # The back-ends' own package is where the concurrency lives -- Repaint
        # and Close are documented as callable from any goroutine, and the paint
        # loop runs in another one -- and it was the ONE package the race
        # detector never saw: the gate below covers internal/* only. A Close
        # racing a frame unmaps the memory that frame is writing into, which is a
        # segmentation fault rather than a wrong pixel, and it reached main.
        env:
          CGO_ENABLED: "1"
        run: go test -race -timeout 300s .
      - name: 100% coverage gate (internal/x11 + internal/wayland + internal/wasmbox + internal/cocoa + internal/win32)
        shell: bash
        # -race needs cgo, so this step (and only this step) enables it. All five
        # sovereign layers stay CGO-free, proven by the CGO=0 arch matrix below.
        # internal/wasmbox's syscall/js transport (client_js.go), internal/cocoa's
        # AppKit glue (cocoa_darwin.go) and internal/win32's Win32/GDI glue
        # (win32_windows.go) are excluded here by build tag on the Linux host, so
        # the gate measures their pure, OS-independent codecs (protocol.go /
        # mapping.go) — 100% by construction. The cocoa AppKit glue is proven live
        # on the darwin lane below; the Win32 glue is proven live on a Windows 11
        # arm64 VM (internal/win32/win32-capture-2026-08-10.png).
        env:
          CGO_ENABLED: "1"
        run: |
          for pkg in internal/x11 internal/wayland internal/wasmbox internal/cocoa internal/win32; do
            go test -race -timeout 300s -coverprofile=cover.out "./$pkg/"
            go tool cover -func=cover.out | tail -n 60
            cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
            echo "$pkg coverage: ${cov}%"
            awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
              echo "::error::$pkg coverage ${cov}% < 100%"; exit 1; }
          done

  # macOS (Cocoa/AppKit) lane: build + vet + test the whole module CGO-free on
  # darwin — where Open now returns the REAL native NSWindow backend
  # (internal/cocoa over github.com/go-macos/objc, pure-Go via purego) rather
  # than ErrUnsupported — then run the live on-device window proof: open a real
  # NSWindow showing go-widgets widgets, render it on-device, assert sampled
  # pixels, synthesise a click + key and assert the dispatched toolkit.Event and
  # the button's OnClick counter. The Cocoa AppKit glue is darwin-only by build
  # tag; the OS-independent NSEvent→toolkit.Event mapping it uses is the same
  # internal/cocoa/mapping.go the Linux coverage gate proves to 100%. The
  # Linux-only X11/Wayland syscall backends are excluded here by build tag; their
  # transport-agnostic codec tests still run.
  darwin-cocoa:
    name: darwin (cocoa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: CGO_ENABLED=0 go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - run: CGO_ENABLED=0 go test ./...
      - name: Live Cocoa window proof (on-device NSWindow + input round-trip)
        env:
          WINDOW_COCOA_INTEGRATION: "1"
        run: CGO_ENABLED=0 go test -tags=integration -run TestLiveCocoaWindow -v ./internal/cocoa/
      - name: Upload the on-device window render as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocoa-capture
          path: |
            internal/cocoa/cocoa-capture-2026-08-10.png
            internal/cocoa/cocoa-screencapture-2026-08-10.png
          if-no-files-found: warn

  # Cross-build regression guard: the whole module MUST compile CGO-free for
  # every non-native target. windows/{amd64,arm64} now compile the REAL native
  # Win32/GDI backend (internal/win32, pure-Go via syscall.NewLazyDLL + a
  # syscall.NewCallback WNDPROC — no cgo) that Open returns on GOOS=windows,
  # proving it links CGO-free on both Windows arches and that the Linux-only
  # X11/Wayland backends do not leak unix-only syscalls into the windows (or any
  # non-unix) build. It also proves the js/wasm (wasmbox external-client) backend
  # + its cmd/gowidgetsclient example compile under GOOS=js GOARCH=wasm. Pure-Go
  # cross-compilation needs no target runner, so all targets build (and vet) from
  # a single Linux host. (The live Win32 window is proven on-device on a Windows
  # 11 arm64 VM; see internal/win32/win32-capture-2026-08-10.png.)
  cross-build:
    name: cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: js,      goarch: wasm }
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: riscv64 }
          - { goos: linux,   goarch: loong64 }
          - { goos: linux,   goarch: ppc64le }
          - { goos: linux,   goarch: s390x }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
      - name: Vet (${{ matrix.goos }}/${{ matrix.goarch }})
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

  # Validate the module on the six supported 64-bit targets, strictly CGO=0.
  # amd64/arm64 run natively; the rest run under qemu-user. This is where the
  # wire codec's big-endian path is exercised on real big-endian (s390x) and
  # little-endian (ppc64le/riscv64/loong64) models.
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go env GOARCH && CGO_ENABLED=0 go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Test under qemu (${{ matrix.goarch }})
        run: CGO_ENABLED=0 GOARCH=${{ matrix.goarch }} go test -exec=${{ matrix.qemu }} ./...

  # Live X11 proof: open a real window under Xvfb, present a known test
  # pattern, capture it and assert sampled pixels; synthesise a key + click
  # via xdotool and assert the dispatched toolkit.Event. This lane also proves
  # the MIT-SHM present path: TestLiveX11SHMActive asserts Open() is presenting
  # through ShmPutImage (so the pixels asserted above are drawn via shared
  # memory, not PutImage), and TestLiveX11SHMMeasure records, on this runner,
  # present latency and bytes-over-socket for ShmPutImage vs plain PutImage
  # (uploaded as shm-measure.txt). Gated on Linux.
  live-xvfb:
    name: live X11 (Xvfb, +MIT-SHM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install X utilities
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-apps xdotool imagemagick dbus
      - name: Run live integration test under Xvfb
        env:
          WINDOW_X11_INTEGRATION: "1"
        # dbus is here for the desktop-appearance proof, which starts its own
        # private session bus: the unit tests answer Settings.Read from a
        # hand-made object and never touch serialisation, which is exactly where
        # a variant-wrapped variant can lie.
        run: xvfb-run -s "-screen 0 1024x768x24" go test -tags=integration -run TestLiveX11 -v ./...
      - name: Upload the captured window + SHM measurement as build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-capture
          path: |
            live-capture.png
            shm-measure.txt
          if-no-files-found: warn

  # Live Wayland proof (present + input): open a real xdg-shell toplevel on a
  # headless wlroots compositor (sway), present a known test pattern through a
  # wl_shm buffer, capture the output with grim and assert sampled pixels; then
  # drive real input over a SECOND connection using the sovereign
  # zwp_virtual_keyboard_v1 / zwlr_virtual_pointer_v1 client bindings (no
  # external injector command) and assert the exact dispatched toolkit.Event
  # (char 'a' and a click at the injected coordinate). Attaching the virtual
  # devices makes the device-less headless seat advertise keyboard+pointer,
  # which the window picks up via dynamic hot-plug. xkbcli (libxkbcommon)
  # compiles the us keymap the virtual keyboard uploads.
  live-wayland:
    name: live Wayland (input)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install a headless Wayland compositor + capture/keymap tools
        run: sudo apt-get update && sudo apt-get install -y sway grim libxkbcommon-tools dbus
      - name: Run live integration test under sway (headless)
        shell: bash
        run: |
          set -x
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          cat > sway.conf <<'CONF'
          output HEADLESS-1 resolution 800x600
          default_border none
          default_floating_border none
          gaps inner 0
          gaps outer 0
          CONF
          export WLR_BACKENDS=headless
          export WLR_RENDERER=pixman
          export WLR_LIBINPUT_NO_DEVICES=1
          export LIBSEAT_BACKEND=noop
          export WLR_HEADLESS_OUTPUTS=1
          dbus-run-session -- sway -c sway.conf &
          # Wait for sway to create its Wayland socket.
          sock=""
          for i in $(seq 1 60); do
            sock=$(ls "$XDG_RUNTIME_DIR"/wayland-* 2>/dev/null | grep -v '\.lock' | head -1 || true)
            [ -n "$sock" ] && break
            sleep 0.5
          done
          if [ -z "$sock" ]; then echo "::error::sway Wayland socket never appeared"; exit 1; fi
          export WAYLAND_DISPLAY="$(basename "$sock")"
          echo "using WAYLAND_DISPLAY=$WAYLAND_DISPLAY in $XDG_RUNTIME_DIR"
          WINDOW_WAYLAND_INTEGRATION=1 go test -tags=integration -run TestLiveWayland -v ./...
      - name: Upload the captured window as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-wayland-capture
          path: live-wayland-capture.png
          if-no-files-found: warn

  # Live HiDPI proof: a SECOND headless sway, configured with `output HEADLESS-1
  # scale 2`, because the lane above deliberately runs at scale 1 and its pixel
  # assertions are written for it. The window paints alternating one-pixel
  # stripes: four flat quadrants would prove nothing, since a 2x upscale of flat
  # colour is pixel-identical to the real thing, while a stripe cannot survive
  # one -- from a half-resolution buffer every stripe comes back two pixels wide.
  # The test measures both, the second being the control.
  live-wayland-hidpi:
    name: live Wayland (HiDPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install a headless Wayland compositor + capture tools
        run: sudo apt-get update && sudo apt-get install -y sway grim dbus
      - name: Run the HiDPI proof under a scale-2 sway
        shell: bash
        run: |
          set -x
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          cat > sway-hidpi.conf <<'CONF'
          output HEADLESS-1 resolution 800x600 scale 2
          default_border none
          default_floating_border none
          gaps inner 0
          gaps outer 0
          CONF
          export WLR_BACKENDS=headless
          export WLR_RENDERER=pixman
          export WLR_LIBINPUT_NO_DEVICES=1
          export LIBSEAT_BACKEND=noop
          export WLR_HEADLESS_OUTPUTS=1
          dbus-run-session -- sway -c sway-hidpi.conf &
          sock=""
          for i in $(seq 1 60); do
            sock=$(ls "$XDG_RUNTIME_DIR"/wayland-* 2>/dev/null | grep -v '\.lock' | head -1 || true)
            [ -n "$sock" ] && break
            sleep 0.5
          done
          if [ -z "$sock" ]; then echo "::error::sway Wayland socket never appeared"; exit 1; fi
          export WAYLAND_DISPLAY="$(basename "$sock")"
          WINDOW_WAYLAND_HIDPI=1 go test -tags=integration -run TestLiveWlHiDPI -v ./...
      - name: Upload the captures as build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-hidpi-captures
          path: |
            live-hidpi-native.png
            live-hidpi-logical.png
          if-no-files-found: warn
